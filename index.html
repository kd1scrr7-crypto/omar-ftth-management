
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة مشتركين الوكيل عمر لازم</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f8;font-family:Arial,sans-serif;color:#17243a}
header{background:#102d50;color:white;padding:25px 12px;text-align:center}
header h2{margin:0 0 10px;font-size:22px}
header p{margin:0;color:#d3e3f5}
main{padding:14px;max-width:850px;margin:auto}
.card{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #00000010}
button,input,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #d5dce5}
button{background:#164d7d;color:white;border:0;cursor:pointer}
input,select{width:100%;margin:6px 0;background:white}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid button{padding:17px 5px;font-weight:bold}
.sub{border-bottom:1px solid #eee;padding:12px 0;overflow-wrap:anywhere}
.sub button{padding:7px 10px;margin:3px}
.muted{color:#718096;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#eaf2fa;padding:13px;border-radius:10px;text-align:center}
.stat strong{display:block;font-size:22px;color:#164d7d}
</style>
</head>
<body>

<header>
<h2>إدارة مشتركين الوكيل عمر لازم</h2>
<p>FTTH الوطني | برمجة عباس جواد</p>
</header>

<main>

<div class="card">
<h3>لوحة الإدارة</h3>
<div class="stats">
<div class="stat"><strong>2</strong>المناطق</div>
<div class="stat"><strong>90</strong>FAT</div>
<div class="stat"><strong>1440</strong>السعة الكلية</div>
<div class="stat"><strong>16</strong>مشترك لكل FAT</div>
</div>
</div>

<div class="card">
<h3>اختر المنطقة</h3>
<select id="zone" onchange="showFATs()">
<option value="FNS281-3">FNS281-3</option>
<option value="FNS284-3">FNS284-3</option>
</select>
</div>

<div class="card">
<h3>البحث عن مشترك</h3>
<input id="search" placeholder="اسم المشترك أو رقم الهاتف" oninput="searchSubs()">
<div id="results"></div>
</div>

<div class="card">
<h3>قائمة FAT</h3>
<div class="grid" id="fats"></div>
</div>

<div class="card" id="details" style="display:none">
<h3 id="fatTitle"></h3>
<div id="subscribers"></div>
<h3>إضافة مشترك</h3>
<input id="subName" placeholder="اسم المشترك">
<input id="subPhone" placeholder="رقم الهاتف" type="tel">
<button onclick="addSub()">حفظ المشترك</button>
</div>

<p class="muted" style="text-align:center">
شركة الوطني للكيبل الضوئي FTTH
</p>

</main>

<script>
let data=JSON.parse(localStorage.getItem('ftthData')||'{}');
let currentFAT=1;
let currentZone='FNS281-3';

function save(){
 localStorage.setItem('ftthData',JSON.stringify(data));
}

function key(){
 return currentZone+'-FAT'+currentFAT;
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
 })[c]);
}

function showFATs(){
 currentZone=document.getElementById('zone').value;
 document.getElementById('details').style.display='none';
 let html='';
 for(let i=1;i<=45;i++){
 html+=`<button onclick="openFAT(${i})">FAT${i}</button>`;
 }
 document.getElementById('fats').innerHTML=html;
}

function openFAT(n){
 currentFAT=n;
 document.getElementById('details').style.display='block';
 document.getElementById('fatTitle').textContent=
 currentZone+' — FAT'+n;
 document.getElementById('subName').value='';
 document.getElementById('subPhone').value='';
 showSubs();
 document.getElementById('details').scrollIntoView({behavior:'smooth'});
}

function showSubs(){
 let arr=data[key()]||[];
 let html='';
 for(let i=0;i<16;i++){
 let s=arr[i];
 html+=`<div class="sub"><b>المشترك ${i+1}:</b> `;
 if(s){
 html+=`${escapeHTML(s.name)} — ${escapeHTML(s.phone)}
 <button onclick="editSub(${i})">تعديل</button>
 <button onclick="deleteSub(${i})">حذف</button>`;
 }else{
 html+='<span class="muted">فارغ</span>';
 }
 html+='</div>';
 }
 document.getElementById('subscribers').innerHTML=html;
}

function addSub(){
 let name=document.getElementById('subName').value.trim();
 let phone=document.getElementById('subPhone').value.trim();

 if(!name){
 alert('يرجى كتابة اسم المشترك');
 return;
 }

 let arr=data[key()]||[];
 let index=arr.findIndex(x=>!x);

 if(index===-1){
 alert('هذا FAT ممتلئ، الحد 16 مشتركاً');
 return;
 }

 arr[index]={name,phone};
 data[key()]=arr;
 save();
 showSubs();

 document.getElementById('subName').value='';
 document.getElementById('subPhone').value='';

 alert('تم حفظ المشترك بنجاح');
}

function editSub(i){
 let arr=data[key()];
 let name=prompt('تعديل الاسم',arr[i].name);
 if(name===null)return;

 let phone=prompt('تعديل الهاتف',arr[i].phone);
 if(phone===null)return;

 if(!name.trim()){
 alert('الاسم لا يمكن أن يكون فارغاً');
 return;
 }

 arr[i]={name:name.trim(),phone:phone.trim()};
 save();
 showSubs();
}

function deleteSub(i){
 if(!confirm('هل تريد حذف هذا المشترك؟'))return;
 data[key()][i]=null;
 save();
 showSubs();
}

function searchSubs(){
 let q=document.getElementById('search').value.trim().toLowerCase();
 let out='';

 if(!q){
 document.getElementById('results').innerHTML='';
 return;
 }

 Object.keys(data).forEach(k=>{
 (data[k]||[]).forEach((s,i)=>{
 if(s && (
 s.name.toLowerCase().includes(q) ||
 s.phone.includes(q)
 )){
 let parts=k.split('-FAT');
 out+=`<div class="sub">
 <b>${escapeHTML(s.name)}</b>
 <br>${escapeHTML(s.phone)}
 <p class="muted">
 ${parts[0]} — FAT${parts[1]} — المشترك ${i+1}
 </p></div>`;
 }
 });
 });

 document.getElementById('results').innerHTML=
 out||'<p class="muted">لا توجد نتائج</p>';
}

showFATs();
</script>

</body>
</html>
