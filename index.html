
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة مشتركين الوكيل عمر لازم</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f8;font-family:Arial;color:#17243a}
header{background:#102d50;color:white;padding:24px 12px;text-align:center}
header h2{margin:0 0 10px}
header p{margin:0;color:#d3e3f5}
main{padding:14px;max-width:850px;margin:auto}
.card{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #00000010}
button,input,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #d5dce5}
button{background:#164d7d;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5}
input,select{width:100%;margin:6px 0;background:white}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid button{padding:15px 4px;font-weight:bold}
.sub{border-bottom:1px solid #eee;padding:12px 0;overflow-wrap:anywhere}
.sub button{padding:7px 10px;margin:4px}
.muted{color:#718096;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#eaf2fa;padding:13px;border-radius:10px;text-align:center}
.stat strong{display:block;font-size:22px;color:#164d7d}
.hidden{display:none}
.danger{background:#a83232}
#status{padding:10px;overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
<h2>إدارة مشتركين الوكيل عمر لازم</h2>
<p>FTTH الوطني | برمجة عباس جواد</p>
</header>

<main>

<div class="card" id="loginCard">
<h3>تسجيل الدخول</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">دخول إلى البرنامج</button>
<p id="loginMessage" class="muted"></p>
</div>

<div id="app" class="hidden">

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
<h3>لوحة الإدارة</h3>
<button id="logoutBtn" class="danger">خروج</button>
</div>
<div class="stats">
<div class="stat"><strong>2</strong>المناطق</div>
<div class="stat"><strong>90</strong>FAT</div>
<div class="stat"><strong>1440</strong>السعة الكلية</div>
<div class="stat"><strong>16</strong>مشترك لكل FAT</div>
</div>
</div>

<div class="card">
<h3>اختر المنطقة</h3>
<select id="zone">
<option>FNS281-3</option>
<option>FNS284-3</option>
</select>
</div>

<div class="card">
<h3>البحث عن مشترك</h3>
<input id="search" placeholder="اسم المشترك أو رقم الهاتف">
<div id="results"></div>
</div>

<div class="card">
<h3>قائمة FAT</h3>
<div class="grid" id="fats"></div>
</div>

<div class="card hidden" id="details">
<h3 id="fatTitle"></h3>
<div id="subscribers"></div>
<h3>إضافة مشترك</h3>
<input id="subName" placeholder="اسم المشترك">
<input id="subPhone" type="tel" placeholder="رقم الهاتف">
<button id="addBtn">حفظ المشترك</button>
</div>

</div>

<div id="status" class="muted"></div>
<p class="muted" style="text-align:center">شركة الوطني للكيبل الضوئي FTTH</p>
</main>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const db=createClient(
'https://igiqayqztxcubhnaowmq.supabase.co',
'sb_publishable_Ukwzfz-clPz-Q56yvdaBPQ_8KAaur4s'
);

const $=id=>document.getElementById(id);

let rows=[];
let zone='FNS281-3';
let fat=1;

function status(t){$('status').textContent=t;}

function esc(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
})[c]);
}

async function login(){
const email=$('email').value.trim();
const password=$('password').value;

if(!email||!password){
$('loginMessage').textContent='اكتب البريد وكلمة المرور';
return;
}

$('loginBtn').disabled=true;
$('loginMessage').textContent='جارٍ الدخول...';

const {error}=await db.auth.signInWithPassword({
email,password
});

$('loginBtn').disabled=false;

if(error){
$('loginMessage').textContent='تعذر الدخول: '+error.message;
return;
}

$('password').value='';
}

async function logout(){
await db.auth.signOut();
}

function showApp(on){
$('loginCard').classList.toggle('hidden',on);
$('app').classList.toggle('hidden',!on);
}

async function loadRows(){
status('جارٍ تحميل المشتركين...');

const {data,error}=await db.from('subscribers')
.select('*')
.order('fat_number')
.order('slot_number');

if(error){
status('خطأ في تحميل البيانات: '+error.message);
return;
}

rows=data||[];
renderFats();
renderDetails();
searchSubs();
status('تم تحميل البيانات السحابية بنجاح');
}

function renderFats(){
let html='';
for(let n=1;n<=45;n++){
const count=rows.filter(x=>
x.zone===zone&&x.fat_number===n).length;
html+=`<button data-fat="${n}">
FAT${n}<br><small>${count}/16</small></button>`;
}
$('fats').innerHTML=html;
}

function openFAT(n){
fat=n;
$('details').classList.remove('hidden');
$('fatTitle').textContent=zone+' — FAT'+fat;
$('subName').value='';
$('subPhone').value='';
renderDetails();
$('details').scrollIntoView({behavior:'smooth'});
}

function renderDetails(){
if($('details').classList.contains('hidden'))return;

const list=rows.filter(x=>
x.zone===zone&&x.fat_number===fat);

let html='';
for(let i=1;i<=16;i++){
const s=list.find(x=>x.slot_number===i);
html+=`<div class="sub"><b>المشترك ${i}:</b>`;

if(s){
html+=`<br>${esc(s.subscriber_name)}
<br>${esc(s.phone)}
<br><button data-edit="${s.id}">تعديل</button>
<button class="danger" data-delete="${s.id}">حذف</button>`;
}else{
html+='<br><span class="muted">فارغ</span>';
}
html+='</div>';
}
$('subscribers').innerHTML=html;
}

async function addSub(){
const name=$('subName').value.trim();
const phone=$('subPhone').value.trim();

if(!name){alert('يرجى كتابة اسم المشترك');return;}

const list=rows.filter(x=>
x.zone===zone&&x.fat_number===fat);

let slot=0;
for(let i=1;i<=16;i++){
if(!list.some(x=>x.slot_number===i)){
slot=i;break;
}
}

if(!slot){alert('هذا FAT ممتلئ');return;}

$('addBtn').disabled=true;

const {error}=await db.from('subscribers').insert({
zone:zone,
fat_number:fat,
slot_number:slot,
subscriber_name:name,
phone:phone
});

$('addBtn').disabled=false;

if(error){
alert('تعذر الحفظ: '+error.message);
return;
}

$('subName').value='';
$('subPhone').value='';
await loadRows();
alert('تم حفظ المشترك بنجاح');
}

async function editSub(id){
const s=rows.find(x=>String(x.id)===String(id));
if(!s)return;

const name=prompt('اسم المشترك',s.subscriber_name);
if(name===null)return;
if(!name.trim()){alert('الاسم مطلوب');return;}

const phone=prompt('رقم الهاتف',s.phone||'');
if(phone===null)return;

const {error}=await db.from('subscribers')
.update({
subscriber_name:name.trim(),
phone:phone.trim()
}).eq('id',id);

if(error){alert('خطأ: '+error.message);return;}
await loadRows();
}

async function deleteSub(id){
if(!confirm('هل تريد حذف المشترك؟'))return;

const {error}=await db.from('subscribers')
.delete().eq('id',id);

if(error){alert('خطأ: '+error.message);return;}
await loadRows();
}

function searchSubs(){
const q=$('search').value.trim().toLowerCase();
if(!q){$('results').innerHTML='';return;}

const found=rows.filter(s=>
(s.subscriber_name||'').toLowerCase().includes(q)||
(s.phone||'').toLowerCase().includes(q));

$('results').innerHTML=found.length?found.map(s=>`
<div class="sub">
<b>${esc(s.subscriber_name)}</b>
<br>${esc(s.phone)}
<p class="muted">${esc(s.zone)} — FAT${s.fat_number}
— المشترك ${s.slot_number}</p>
</div>`).join(''):'<p>لا توجد نتائج</p>';
}

$('loginBtn').addEventListener('click',login);
$('logoutBtn').addEventListener('click',logout);
$('addBtn').addEventListener('click',addSub);
$('zone').addEventListener('change',()=>{
zone=$('zone').value;
$('details').classList.add('hidden');
renderFats();
});
$('search').addEventListener('input',searchSubs);

$('fats').addEventListener('click',e=>{
const b=e.target.closest('[data-fat]');
if(b)openFAT(Number(b.dataset.fat));
});

$('subscribers').addEventListener('click',e=>{
const edit=e.target.closest('[data-edit]');
const del=e.target.closest('[data-delete]');
if(edit)editSub(edit.dataset.edit);
if(del)deleteSub(del.dataset.delete);
});

db.auth.onAuthStateChange((_event,session)=>{
showApp(!!session);
if(session)loadRows();
});

const {data:{session}}=await db.auth.getSession();
showApp(!!session);
if(session)await loadRows();

</script>
</body>
</html>
